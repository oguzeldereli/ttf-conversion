# Qwen3.8-27B -> ternary (T1) + r0.2 ternary adapters (no T2: the same bytes as adapter rank did better), then TTF
# recovery from cached teacher top-k targets. PROPOSED (24 Oct 2026): each part is measured, the combination at 27B is
# not trained end to end yet. Measured: the conversion structure trains in 21.7 GiB at 2 x 8 with r256 and the state on
# the host (L40S, embedding / head frozen); theta 16 with rank 1024 was the best 27B probe (30 steps); at 0.8B, 1 x 16
# micro-batching beat 2 x 8 at the same tokens and 32k tokens per step beat 16k; the online teacher beat a cached top-k
# (k64 +0.014 wiki, k32 +0.037 at 1k), so use --teacher where the bf16 teacher (~54 GB) fits beside the student (96 GB
# cards), else --kd-cache. Set --steps to what the run will reach, so the learning-rate schedule completes.
#   python -m ttf.train --recipe recipes/qwen-27b.toml --init-hf $M --teacher $M --data DATA.bin --steps 2000 \
#     --ext ttfconv.fold --ext ttfconv.adapters:rank=0.2,alt=1,prop=1,svd=rand --out-dir runs/q27
mode = "ttf"
convert = "gptqc"
convert-stream = true
calib = 64
data-dtype = "u32"
seq-len = 2048
batch-size = 1
accum = 16
steps = 2000
warmup = 100
lr = 5e-4
min-lr = 5e-5
ttf-rank = 1024
ttf-theta = 16
ttf-offload = "host"
ttf-store = "fp12s"
dw-sketch = 128
tail = "lean"
kd-weight = 0.75
kd-cache-mode = "rest"
loss-chunk = 512
adapter-rank = 0
head-fused = true
eval-interval = 100
eval-iters = 4
save-secs = 3600
qk-temp = false
