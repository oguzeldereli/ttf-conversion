# Qwen3.8-27B -> ternary (T1) + r0.2 ternary adapters (no T2: the same bytes as adapter rank did better), then TTF
# recovery with distillation. These are the settings of the 27B recovery run started 26 Oct 2026 on 2 x RTX PRO 6000
# (96 GB): accumulator rank 1536 (30% of the width; 1024 / 1536 / 2048 measured at 47.5 / 54.3 / 59.8 s per step on one
# card), theta 16, the state in bf16 on the GPU, the embedding / head as trained 2- / 3-bit integer codes, KD from a
# cached teacher sample (kd-cache-mode sample). The run added on its command line: --pipe (one pipeline stage per GPU,
# torchrun), --kd-cache DIR, --ckpt-skip 15, --steps 7750. Set --steps to what the run will reach, so the learning-rate
# schedule completes.
# Smaller cards (24-48 GB): --ttf-store fp12s --ttf-offload async (the state in host memory) and a lower --ttf-rank; the
# conversion structure trained at a 21.7 GiB peak with r256 that way (L40S). Where the bf16 teacher (~54 GB) fits beside
# the student, --teacher M instead of the cache (at 0.8B the online teacher beat a cached top-k by 0.014 wiki at k64).
#   torchrun --nproc_per_node 2 -m ttf.train --recipe recipes/qwen-27b.toml --init-hf $M --data DATA.bin --pipe \
#     --kd-cache KD_DIR --steps 7750 --ext ttfconv.fold --ext ttfconv.adapters:rank=0.2,alt=1,prop=1,svd=rand --out-dir runs/q27
mode = "ttf"
convert = "gptqc"
convert-stream = true
calib = 64
data-dtype = "u32"
seq-len = 2048
batch-size = 1
accum = 16
steps = 7750
warmup = 100
lr = 5e-4
min-lr = 5e-5
ttf-rank = 1536
ttf-theta = 16
ttf-offload = "none"
ttf-store = "bf16"
dw-sketch = 128
tail = "lean"
kd-weight = 0.75
kd-cache-mode = "sample"
intk-emb = "2:3"
emb-wd = 0
emb-lr-mult = 0.05
tf32 = true
loss-chunk = 512
adapter-rank = 0
eval-interval = 100
eval-iters = 8
save-secs = 3600
qk-temp = false
