# Qwen3.5-0.8B-Base -> ternary + r0.2 ternary adapters, then 1000 steps of TTF recovery with distillation (the best
# measured setting, 24 Oct 2026: wiki / chat / mix 2.9572 / 1.6542 / 1.3368 at step 999 with
#   --ext ttfconv.fold --ext ttfconv.cd:sweeps=1 --ext ttfconv.adapters:rank=0.2,alt=1,prop=1,gmetric=G_DIR).
# 16.5 s per step on an RTX 4070 (32k tokens: 16 micro-batches of one 2048-token sequence).
#   python -m ttf.train --recipe recipes/qwen-0.8b.toml --arch-hf $M --init-ckpt CONV/ckpt.pt --teacher $M --data DATA.bin --ext ... --out-dir runs/q08
mode = "ttf"
data-dtype = "u32"
seq-len = 2048
batch-size = 1
accum = 16
steps = 1000
warmup = 100
lr = 1.5e-3
min-lr = 1.5e-4
ttf-rank = 256
ttf-theta = 16
kd-weight = 0.75
loss-chunk = 512
adapter-rank = 0
ckpt-skip = 3
eval-interval = 100
eval-iters = 8
save-secs = 1800
qk-temp = false
mem-cap-gib = 11.5
