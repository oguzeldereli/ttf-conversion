[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttf-conversion"
version = "0.2.0"
description = "Convert full-precision Qwen3.5 / 3.8 models into ternary networks that TTF (ttf-ternary) keeps training"
license = {file = "LICENSE"}
authors = [{name = "Özgür Güzeldereli"}]
requires-python = ">=3.11"
dependencies = ["ttf-ternary[qwen]>=0.2.0", "torch>=2.13", "numpy"]

[project.optional-dependencies]
tools = ["scipy"]          # ttfconv.tools.kfac_report
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["ttfconv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU (Triton kernels)"]
